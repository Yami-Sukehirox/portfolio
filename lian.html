<!DOCTYPE html>
<html lang="en">
    <head>
    <title>Document</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keyworfs" content="HTML,CSS">
    <meta name="description" content="This is my portfolio website.">
    </head>
        <style>
            .background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
            }
            .coke1 {
                font-size: 20px;
                font-style: italic;
                color:rgb(9, 9, 8);
                position: absolute;
                right: 50px;
                top: 20px;
                border-radius: 5px;
                padding: 5px 10px;
                background-color: yellow;

            }
            .picture {
                position: absolute;
                right: 80px;
                top: 80px;
                width: 100px;
                height: 100px;
                border-radius: 10px;
            }
            .newpic {
                position: absolute;
                right: 200px;
                top: 80px;
                width: 100px;
                height: 100px;
                border-radius: 10px;
            }
            button {
                right: 175px;
                top: 200px;
                position: absolute;
                cursor: pointer;
                transition: background-color 0.3s ease,
                    color 0.3s ease;
                color:rgb(36, 110, 175);
                background-color: red;
                border-radius: 5px;    
            }
            button:hover {
                background-color: rgb(27, 184, 113);
            }
            .wew {
                position: absolute;
                top: 20px;
                left: 20px;
                background-color: yellow;
                color: black;
                border-radius: 10px;
                cursor: pointer;
            }
            

            
                      
        </style>
    <body>

        <h2 class="coke1">Welcome to the Minions World!</h2>
        <img src="images/minions.home.jpg" 
        class="background"/>

        <img src="images/lian.home.jpg" class="picture"/>
        <img src="images/wow.is.jpg" class="newpic"/>

        <button>click</button>

        <a href="company/index.html">
            <button>Next Page</button>
        </a>

        <button class="wew">Sign up</button>
       





    </body>
</html>
